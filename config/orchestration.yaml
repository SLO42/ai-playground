# Orchestration config (D-004 / D-017 / D-020).
#
# mode: how the orchestrator drains the task queue.
#   event    — react to task lifecycle events / live queries (default; no busy loop)
#   periodic — also sweep every intervalMs as a safety net
#   manual   — only on explicit trigger
mode: event
triggers: [task_created, task_unblocked]
intervalMs: 60000

# MODEL-BENCHMARK-SPEC step 1 — global default model provider (the local-vs-cloud A/B toggle).
#   auto  — route normally (local floor → escalate). DEFAULT / no-regression.
#   local — force every orchestrator-routed spawn onto the local `local` tier (Ollama, $0).
#   cloud — force every orchestrator-routed spawn onto a cloud tier (Claude).
# Read once per boot (restart to apply — /settings surfaces this honestly, F-029).
defaultProvider: auto

# SVC-1 (SERVICES-SPEC / D-004 additive note, DECISIONS.md 7ca9145) — the local-services
# supervision tick. The ServicesManager owns pid+health liveness + bounded auto-restart, but
# had NO production scheduler: a crashed service (e.g. an operator-armed Ollama) stayed down
# until a page load happened to observe it. This arms a BOUNDED, unref'd periodic tick in the
# server boot path that reconciles the managed services on this cadence — a crashed desired-up
# service is auto-restarted (bounded by maxRestarts, incident-logged). The timer is unref'd
# (never holds the process open, F-014), single-flight (a slow tick never overlaps itself), and
# every tick is fault-isolated (a DB/probe fault logs + never crashes the server, F-014). Read
# once per boot (restart to apply, F-029).
#   tickMs: 300000  — the interval in ms (default when absent: 300000 = 5 min).
#   tickMs: 0       — OFF (no periodic supervision; the manual-only / page-load-observed contract).
services:
  tickMs: 300000

# Interactive concurrency caps (orchestrator semaphore).
concurrency:
  maxAgents: 8        # total simultaneous interactive spawns
  perProject: 3       # Per-session git-worktree isolation (WI-1..WI-3) now makes >1 concurrent
                      # spawn per project SAFE: each WRITE session runs in its OWN worktree on the
                      # session branch (no shared-cwd file/git stomping), and merge-back is
                      # FF-or-preserve (it serializes the integration into the project branch, and
                      # falls back to preserving the session branch instead of clobbering on a
                      # non-FF). This supersedes the F-046 perProject=1 stopgap. Kept conservative
                      # at 3 (< maxAgents=8, below the floor(maxAgents×0.5)=4 resource-profile
                      # auto-default) so one project still cannot monopolise the interactive pool.
  # D-021 DAILY SPAWN CAP — the hard rolling-24h ceiling on how many background work_items the
  # orchestrator may CLAIM (drain → spawn). This is the safety ceiling that makes 'full
  # unsupervised' drive-to-release safe: once today's claim count hits this, the drain STOPS
  # claiming new work and parks the rest (the /atelier/queue monitor surfaces capped/throttled).
  # A loop bug or a runaway PM therefore CANNOT spawn past it / burn unbounded spend. The window
  # is anchored on each item's claimed_at, so it survives restarts.
  # 0 = UNCAPPED (opt-in; like `periodic`, off-by-default semantics for older configs). Default
  # 200: at maxAgents=8 with realistic multi-minute interactive sessions, 200/day is generous
  # headroom for legitimate autonomous work yet hard-stops a spin-bug (which blows past it in
  # minutes). Operator-tunable.
  dailySpawnCap: 200

# COST-GOVERNANCE-SPEC CG-2 — the GLOBAL rolling-24h TOKEN budget.
#
# dailySpawnCap (above) bounds runaway SPAWNING (a claim COUNT); this bounds runaway SPEND
# (real tokens). It meters EVERY spend source — the background drain, manual/interactive
# launches, ceremony/gauntlet interview runs, concierge Stage-2 turns, benchmark runs —
# enforced INSIDE the spend chokepoints (launchSession, the gauntlet runner, the concierge
# provider call), so a new call site cannot bypass it (F-055). The counter is Σ(tokens_in +
# tokens_out) over agent_event completion rows in the trailing 24h, anchored on the durable
# event timestamp (restart-proof).
#
# At-cap behavior: a background/orchestrator launch is REFUSED and its work PARKED (re-drains
# when the window rolls forward / spend frees) — never dropped, never burned. An operator-
# explicit (manual UI) launch gets a WARN and may proceed only with an explicit override
# (operator authority). Every refusal/override emits a named analytics event {spent, budget}.
#
# 0 = UNCAPPED (the shipped default — no-regression; honest opt-in, like dailySpawnCap). Set a
# positive integer to arm the ceiling. Operator-tunable; read live at each chokepoint.
spend:
  # OPERATOR DECISION (2026-07-23): armed as a runaway BACKSTOP, not a target. Normal autonomous
  # work runs well under this; it exists to hard-stop a spin-bug / runaway loop from burning
  # unbounded spend. Fully adjustable later. 0 would mean UNCAPPED (the old hole) — the /services
  # budget-safety banner loudly flags any 0-while-a-loop-is-armed state so it can never go silent.
  dailyTokenBudget: 15000000

  # COST-GOVERNANCE-SPEC CG-3 — the OPTIONAL per-project token ceiling. Same uniform semantics as
  # dailyTokenBudget (0 = UNCAPPED sentinel; positive arms; durable-anchor / restart-proof), enforced
  # at the SAME launchSession chokepoint but keyed by the launch's project id — the counter sums tokens
  # over THAT project's completion rows in the trailing 24h. It stops ONE project eating the whole
  # global budget: `dailyTokenBudget` bounds total spend; this bounds any single project's slice. Both
  # are checked independently, so either can refuse a launch. 0 = the shipped default (no-regression).
  # OPERATOR DECISION (2026-07-23): armed as a per-project runaway BACKSTOP (< the global daily
  # ceiling) so one project cannot eat the whole budget. Not a target — normal work runs under it.
  perProjectTokenBudget: 5000000

# Intent-adaptive config bundles (D-020). KongCode classifies each task's intent;
# routing (resolveRoute) looks the intent up here and applies the bundle: thinking
# tier, tool-call budget, memory-retrieval depth + share, token budget. A trivial
# question stays cheap; a debug/explore task gets deep retrieval + a higher budget.
# Tunable — edit the values; the loader validates shape/range at boot (fail-closed).
#
# Knobs (all optional; an absent knob = runtime/memory default):
#   thinking        none | low | medium | high   (spawn thinking tier)
#   retrievalDepth  non-negative int             (vector KNN limit for recall)
#   retrievalShare  0..1                          (context-window share for retrieval)
#   toolCalls       non-negative int             (per-spawn tool-call budget)
#   concurrency     non-negative int             (per-spawn concurrency hint)
#   tokenBudget     non-negative int             (per-spawn token budget)
bundles:
  simple-question:
    thinking: none
    retrievalDepth: 0
    retrievalShare: 0.0
    toolCalls: 4
  code-read:
    thinking: low
    retrievalDepth: 4
    retrievalShare: 0.25
    toolCalls: 15
  code-write:
    thinking: medium
    retrievalDepth: 6
    retrievalShare: 0.4
    toolCalls: 40
    concurrency: 2
    # D-036 per-task capability provisioning (TASK 5.1). An explicit, allow-listed
    # selection from the cc-config catalog (cc_skill/cc_agent/cc_mcp_server names) the
    # driven code-write session may wield. The runtime catalog-validates these at spawn
    # (fail closed on an unknown id) and composes them onto the harness base — operator
    # plugins/marketplaces stay empty (D-002 isolation). Edit to match the live catalog.
    #
    # INTENTIONALLY EMPTY (F-045): the live cc-config catalog is populated ONLY from synced
    # `.claude` scopes (project roots + ~/.claude via cc-config/sync). `svelte5-patterns` /
    # `error-learning` live solely in the platform repo's own `.claude` — which is neither a
    # registered project root nor ~/.claude — so they can never enter the catalog through the
    # current sync path, and declaring them here fail-closes EVERY code-write spawn (D-036).
    # They're also project-irrelevant (a svelte skill on a C#/BepInEx build). Re-add ids here
    # ONLY after they appear in the live catalog (a synced scope that carries them). With no
    # `capabilities` block, the runtime composes the EMPTY_SET (no throw) onto the harness base.
  code-debug:
    thinking: high
    retrievalDepth: 10
    retrievalShare: 0.5
    toolCalls: 60
  deep-explore:
    thinking: high
    retrievalDepth: 16
    retrievalShare: 0.6
    toolCalls: 80
    tokenBudget: 200000
