# config/workforce.yaml — THE single config namespace for ALL workforce keys
# (PM-SPEC §1/§4.5; WORKFORCE-SPEC §3.5/§3.7/§5). Loaded + validated at the config
# boundary (src/lib/server/config/load.ts loadWorkforce — fail closed on shape).
#
# Defaults policy (G5 / F-008): every value here is either JUSTIFIED by its spec or
# ships UNARMED (null) until the operator sets it from our own real history — no
# imported magic numbers. null ≠ 0: an unarmed bound means "surface, don't enforce".

pm:
  # The PM runs on a strong frontier model — default Fable 5 (PM-SPEC §1, operator
  # 2026-06-10). PM sessions route with this as the EXPLICIT {provider, model_id}
  # override (F-005 short-circuit), recorded in routing_event. Operator-tunable;
  # per-project overrides may land on the pm row later if needed.
  provider: claude
  model_id: claude-fable-5
  # PM-SPEC §4.5 decision bounds — ship unarmed: until the operator sets a bound
  # from our own history, anything that would need it classifies as Taste and
  # surfaces on the next decision brief (never silently self-decided).
  decide:
    blast_radius_max_files: null
    effort_ceiling_minutes: null
  # PM-SPEC §3 event ① (TASK 16.2): session-failed/task-blocked distress must EXCEED
  # this count (since the PM's last review) to auto-fire a review. Ships UNARMED
  # (null, F-008): no invented bound — set it from real project history to arm.
  triggers:
    failure_threshold: null

panel:
  scope:
    # PM-SPEC §4.6.3 complexity tripwires — operator-tunable, never imported. null =
    # unarmed: complexity is raised as an evidenced judgment finding, not a numeric
    # verdict, until the operator sets these from our own wave history.
    max_files: null
    max_new_services: null

gauntlet:
  # WORKFORCE-SPEC §3.5 pass bar — ARMED at launch, justified (not invented):
  # admission reference-runs prove every plant findable and every clean section
  # clean, so a miss or a false positive is a real error, not a statistic.
  pass_recall: 1.0
  max_false_positives: 0
  # §3.1 candidate-session wall-clock bound (minutes) — a conservative starting
  # point sized to the launch fixtures (F-014 discipline), operator-tunable.
  session_timeout_minutes: 15

budget:
  # §3.7 spend caps — null = NOTHING auto-runs; auto-triggers only count-and-surface
  # until the operator sets a cap (F-008: no invented spend number).
  max_auto_interviews_per_day: null
  allowed_auto_tiers: []

drift:
  # §5 drift triggers (operator decision 4, 2026-06-16): an ARMED signal crossing
  # its threshold AUTO-RAISES a review_proposal{status:proposed} — but prompt
  # authoring, re-gauntlet, and the SWAP stay operator-gated (D-010 diff + D-039).
  # NEVER auto-swaps, NEVER auto-authors a prompt. Categorical signals armed (an
  # escaped defect or operator feedback is a real event); the confidence-
  # miscalibration signal derives from the EXISTING A1 calibration (high-confidence
  # verdicts trending to bad/overridden/revised outcomes). RATE signals
  # (refutation/fixloop) ship unarmed (null) until v2.2b's B2 + review_verdict —
  # rendered '— (needs B2)', no placeholder math (F-008).
  escaped_defect: true
  operator_feedback: true
  # Confidence-miscalibration (the A1 calibration source): a role version whose
  # HIGH-confidence verdicts go bad (overridden_by_operator | revised) at or above
  # this rate is miscalibrated. ARMED with a conservative spec default (0.5 = half
  # its confident calls were wrong) — operator-tunable; null disarms it entirely.
  confidence_miscalibration: true
  confidence_miscalibration_rate: 0.5
  refutation_rate: null
  fixloop_rate: null

research:
  # WORKFORCE-SPEC §7b rail ⑤ — the bounded research budget. Ships UNARMED (null):
  # with no bound the researcher is NOT permitted to fetch — the task returns an
  # honest partial deliverable rather than crawling silently (F-008: no invented
  # bound). Arm both from real cost history (a positive minute budget + a fetch cap)
  # to permit managed web research; null on either disarms fetching entirely.
  max_wall_clock_minutes: null
  max_fetches: null

workforce:
  # §5 — conservative starting points, NOT derived truths; operator-tunable,
  # revisit on real data. Below min_events_for_claim the PM must not claim
  # degradation.
  track_window_days: 14
  min_events_for_claim: 5
  max_open_proposals: 2
