<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { padding: 28px; display: flex; align-items: center; gap: 18px; min-height: 90px; }
  .on-dark { background: var(--color-bg); }
  .on-panel { background: var(--color-surface-raised); border-left: 1px solid var(--color-border); }
  .lbl { font: var(--type-mono-sm); color: var(--color-text-subtle); padding: 10px 28px; border-top: 1px solid var(--color-border-faint); }
  img { display: block; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell on-dark"><img src="../assets/logo.svg" alt="ai-playground" width="240"></div>
    <div class="cell on-panel"><img src="../assets/mark.svg" alt="mark" width="44"><img src="../assets/mark.svg" alt="mark" width="32" style="opacity:.85"><img src="../assets/mark.svg" alt="mark" width="24" style="opacity:.7"></div>
  </div>
  <div class="lbl">JetBrains Mono 600 wordmark · the bracket harness embraces a live teal node · clear-space ≥ the bracket height</div>
</body>
</html>
