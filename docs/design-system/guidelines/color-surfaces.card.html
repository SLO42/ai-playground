<!-- @dsCard group="Colors" viewport="700x150" name="Surface ramp" subtitle="App bg → panel → card → raised → overlay" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--color-border); }
  .cell { flex: 1; padding: 14px 12px; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; }
  .tok { font: var(--type-mono-sm); color: var(--color-text-2); }
  .var { font: var(--weight-medium) var(--text-2xs)/1.4 var(--font-sans); color: var(--color-text-subtle); margin-top: 3px; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell" style="background:var(--color-bg)"><div class="tok">bg</div><div class="var">--color-bg</div></div>
    <div class="cell" style="background:var(--color-surface)"><div class="tok">surface</div><div class="var">--color-surface</div></div>
    <div class="cell" style="background:var(--color-surface-card)"><div class="tok">card</div><div class="var">--color-surface-card</div></div>
    <div class="cell" style="background:var(--color-surface-raised)"><div class="tok">raised</div><div class="var">--color-surface-raised</div></div>
    <div class="cell" style="background:var(--color-surface-overlay)"><div class="tok">overlay</div><div class="var">--color-surface-overlay</div></div>
  </div>
</body>
</html>
