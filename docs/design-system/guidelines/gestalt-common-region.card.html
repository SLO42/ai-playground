<!-- @dsCard group="Gestalt" viewport="700x200" name="Common region" subtitle="A bounded surface groups items into one object — never nest regions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .lbl { font: var(--type-label); color: var(--color-text-subtle); margin-bottom: 10px; }
  .loose { display: grid; gap: 8px; }
  .item { font: var(--type-mono-sm); color: var(--color-text-muted); }
  .region { background: var(--color-surface-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 16px; display: grid; gap: 8px; box-shadow: var(--shadow-card); }
  .region .item { color: var(--color-text-2); }
  .x { color: var(--color-error); } .ok { color: var(--color-success); }
</style>
</head>
<body>
  <div>
    <div class="lbl"><span class="x">✗</span> loose — no grouping</div>
    <div class="loose"><span class="item">SurrealDB · running</span><span class="item">Ollama · running</span><span class="item">Engine · event mode</span></div>
  </div>
  <div>
    <div class="lbl"><span class="ok">✓</span> one common region</div>
    <div class="region"><span class="item">SurrealDB · running</span><span class="item">Ollama · running</span><span class="item">Engine · event mode</span></div>
  </div>
</body>
</html>
