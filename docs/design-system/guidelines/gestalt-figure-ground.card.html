<!-- @dsCard group="Gestalt" viewport="700x190" name="Figure–ground & focal point" subtitle="Surfaces rise from the onyx ground; accent is rationed to one focal action" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 0; background: var(--color-bg); }
  .ground { padding: 26px; }
  .panel { background: var(--color-surface-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-raised); padding: 18px 20px; display: flex; align-items: center; gap: 12px; }
  .title { font: var(--type-h3); color: var(--color-text); }
  .btns { margin-left: auto; display: flex; gap: 10px; }
  .b { padding: 0 16px; height: 32px; display: inline-flex; align-items: center; border-radius: var(--radius-sm); font: var(--weight-medium) var(--text-sm) var(--font-sans); }
  .ghost { background: transparent; color: var(--color-text-muted); }
  .sec { background: var(--color-surface-overlay); color: var(--color-text); border: 1px solid var(--color-border-strong); }
  .pri { background: var(--color-accent); color: var(--color-on-accent); }
  .note { font: var(--text-sm) var(--font-sans); color: var(--color-text-muted); padding: 0 26px 22px; max-width: 600px; }
</style>
</head>
<body>
  <div class="ground">
    <div class="panel">
      <span class="title">Session 7fa2e1b9</span>
      <div class="btns"><span class="b ghost">Cancel</span><span class="b sec">Interject</span><span class="b pri">Start run</span></div>
    </div>
  </div>
  <div class="note">The panel reads as figure against the onyx ground (elevation + a surface step). Accent appears once — the eye lands on the single primary action.</div>
</body>
</html>
