<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="4px base — one scale for gaps, padding, layout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; display: grid; gap: 7px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .bar { height: 14px; background: var(--color-accent); border-radius: 2px; }
  .tok { font: var(--type-mono-sm); color: var(--color-text-muted); width: 92px; flex: none; }
  .px { font: var(--type-mono-sm); color: var(--color-text-subtle); }
</style>
</head>
<body>
  <div class="row"><span class="tok">--space-2</span><span class="bar" style="width:4px"></span><span class="px">4</span></div>
  <div class="row"><span class="tok">--space-3</span><span class="bar" style="width:8px"></span><span class="px">8</span></div>
  <div class="row"><span class="tok">--space-4</span><span class="bar" style="width:12px"></span><span class="px">12</span></div>
  <div class="row"><span class="tok">--space-5</span><span class="bar" style="width:16px"></span><span class="px">16</span></div>
  <div class="row"><span class="tok">--space-6</span><span class="bar" style="width:20px"></span><span class="px">20</span></div>
  <div class="row"><span class="tok">--space-7</span><span class="bar" style="width:24px"></span><span class="px">24</span></div>
  <div class="row"><span class="tok">--space-8</span><span class="bar" style="width:32px"></span><span class="px">32</span></div>
  <div class="row"><span class="tok">--space-10</span><span class="bar" style="width:48px"></span><span class="px">48</span></div>
</body>
</html>
